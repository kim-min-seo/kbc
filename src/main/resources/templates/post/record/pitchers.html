<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<div th:fragment="fragment">
<section layout:fragment="contents" class="container mt-5">

    <!-- 탭 버튼 -->
    <div class="mb-3">
        <a th:href="@{/record/batters(year=${year}, team=${team}, sort='AVG')}"
           class="btn"
           th:classappend="${requestURI == '/record/batters'} ? ' btn-primary' : ' btn-outline-primary'">타자 기록</a>
        <a th:href="@{/record/pitchers(year=${year}, team=${team}, sort='ERA')}"
           class="btn"
           th:classappend="${requestURI == '/record/pitchers'} ? ' btn-primary' : ' btn-outline-primary'">투수 기록</a>
    </div>

    <h3 class="mb-4">투수 기록</h3>

    <!-- 검색 필터 -->
    <form method="get" class="row g-3 mb-4">
        <div class="col-auto">
            <select name="year" class="form-select" onchange="this.form.submit()">
                <option th:each="y : ${#numbers.sequence(1982, 2025)}"
                        th:value="${y}"
                        th:selected="${y} == ${year}"
                        th:text="${y} + '년'">2025년
                </option>
            </select>
        </div>
        <div class="col-auto">
            <select name="team" class="form-select" onchange="this.form.submit()">
                <option value="">전체 팀</option>
                <option th:each="t : ${teams}"
                        th:value="${t}"
                        th:selected="${t} == ${team}"
                        th:text="${t}">팀명
                </option>
            </select>
        </div>
        <div class="col-auto">
            <select name="sort" class="form-select" onchange="this.form.submit()">
                <option th:value="'ERA'" th:selected="${sort} == 'ERA'">ERA</option>
                <option th:value="'WHIP'" th:selected="${sort} == 'WHIP'">WHIP</option>
                <option th:value="'G'" th:selected="${sort} == 'G'">경기(G)</option>
                <option th:value="'W'" th:selected="${sort} == 'W'">승(W)</option>
                <option th:value="'L'" th:selected="${sort} == 'L'">패(L)</option>
                <option th:value="'SV'" th:selected="${sort} == 'SV'">세이브(SV)</option>
                <option th:value="'HLD'" th:selected="${sort} == 'HLD'">홀드(HLD)</option>
                <option th:value="'IP'" th:selected="${sort} == 'IP'">이닝(IP)</option>
                <option th:value="'H'" th:selected="${sort} == 'H'">피안타(H)</option>
                <option th:value="'HR'" th:selected="${sort} == 'HR'">피홈런(HR)</option>
                <option th:value="'BB'" th:selected="${sort} == 'BB'">볼넷(BB)</option>
                <option th:value="'HBP'" th:selected="${sort} == 'HBP'">사구(HBP)</option>
                <option th:value="'SO'" th:selected="${sort} == 'SO'">삼진(SO)</option>
                <option th:value="'R'" th:selected="${sort} == 'R'">실점(R)</option>
                <option th:value="'ER'" th:selected="${sort} == 'ER'">자책점(ER)</option>
            </select>
        </div>
    </form>

    <!-- 투수 기록 테이블 -->
    <div class="table-responsive">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th>순위</th>
                    <th>선수명</th>
                    <th>팀명</th>
                    <th>ERA</th>
                    <th>G</th>
                    <th>W</th>
                    <th>L</th>
                    <th>SV</th>
                    <th>HLD</th>
                    <th>IP</th>
                    <th>H</th>
                    <th>HR</th>
                    <th>BB</th>
                    <th>HBP</th>
                    <th>SO</th>
                    <th>R</th>
                    <th>ER</th>
                    <th>WHIP</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p, iterStat : ${pitchers}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${p.playerName}"></td>
                    <td th:text="${p.team}"></td>
                    <td th:text="${p.era}"></td>
                    <td th:text="${p.g}"></td>
                    <td th:text="${p.w}"></td>
                    <td th:text="${p.l}"></td>
                    <td th:text="${p.sv}"></td>
                    <td th:text="${p.hld}"></td>
                    <td th:text="${p.ip}"></td>
                    <td th:text="${p.h}"></td>
                    <td th:text="${p.hr}"></td>
                    <td th:text="${p.bb}"></td>
                    <td th:text="${p.hbp}"></td>
                    <td th:text="${p.so}"></td>
                    <td th:text="${p.r}"></td>
                    <td th:text="${p.er}"></td>
                    <td th:text="${p.whip}"></td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
</div>
</html>
