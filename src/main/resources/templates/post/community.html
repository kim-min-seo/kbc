<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<section layout:fragment="contents" class="container my-5">

  <h1 class="mb-4 text-center">커뮤니티</h1>

  <!-- ✅ 성공 메시지 -->
  <div th:if="${successMessage}" class="alert alert-success text-center">
    <span th:text="${successMessage}">신청 완료!</span>
  </div>

  <!-- 에러 메시지 -->
  <div th:if="${errorMessage}" class="alert alert-danger text-center">
    <span th:text="${errorMessage}">Error occurred</span>
  </div>

  <div class="text-center mb-4">
    <a class="btn btn-outline-primary me-2" th:href="@{/gathering/DIRECT}">직관 모임 보기</a>
    <a class="btn btn-outline-success" th:href="@{/gathering/PUB}">술집 모임 보기</a>
  </div>

  <!-- 글 등록/수정 폼 -->
  <div class="card mb-5 shadow-sm">
    <div class="card-body">
      <form th:action="${editPost != null} ? @{/community/edit} : @{/community}"
            method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:if="${editPost != null}" th:value="${editPost.id}" />
        <div class="row g-3">
          <div class="col-md-4">
            <label for="team" class="form-label">팀</label>
            <input type="text" class="form-control" id="team" name="team"
                   placeholder="응원할 팀을 입력하세요" required
                   th:value="${editPost != null} ? ${editPost.team} : ''" />
          </div>
          <div class="col-md-8">
            <label for="contents" class="form-label">내용</label>
            <textarea class="form-control" id="contents" name="contents"
                      rows="2" placeholder="글을 입력하세요" required
                      th:text="${editPost != null} ? ${editPost.contents} : ''"></textarea>
          </div>
        </div>
        <div class="row g-3 mt-3">
          <div class="col-md-6">
            <label for="imageFile" class="form-label"
                   th:text="${editPost != null} ? '이미지 변경' : '이미지 첨부'">이미지 첨부</label>
            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*" />
          </div>
          <div class="col-md-6 d-flex align-items-end justify-content-end">
            <button type="submit" class="btn btn-primary me-2"
                    th:text="${editPost != null} ? '수정 완료' : '등록'">등록</button>
            <a th:if="${editPost != null}"
               th:href="@{/community(page=${page},size=${size})}"
               class="btn btn-secondary">취소</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 게시글 리스트 -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" th:each="post : ${posts}">
      <div class="card h-100 shadow-sm">

        <!-- 헤더: 팀명 + 수정/삭제 -->
        <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
          <span class="h6 mb-0" th:text="${post.team}">팀명</span>
          <div class="btn-group" role="group">
            <a th:href="@{/community(editId=${post.id},page=${page},size=${size})}"
               class="btn btn-outline-secondary btn-sm" title="수정">
              <i class="bi bi-pencil-fill"></i>
            </a>
            <form th:action="@{/community/delete}" method="post" style="display:inline;">
              <input type="hidden" name="id" th:value="${post.id}" />
              <button type="submit"
                      class="btn btn-outline-danger btn-sm"
                      title="삭제"
                      onclick="return confirm('정말 삭제하시겠습니까?');">
                <i class="bi bi-trash-fill"></i>
              </button>
            </form>
          </div>
        </div>

        <!-- 본문: 내용 + 이미지 + 모임 버튼 -->
        <div class="card-body d-flex flex-column">
          <p class="flex-grow-1" th:text="${post.contents}">내용</p>

          <div th:if="${post.imagePath != null}" class="mt-3 text-center">
            <img th:src="@{${post.imagePath}}" class="img-fluid rounded" alt="첨부 이미지" />
          </div>

          <!-- ✅ 모임 신청 버튼/상태 -->
          <div class="mt-4" th:if="${post.gatheringId != null}">
            <!-- 방금 신청(또는 이미 신청했다는 안내)한 카드 -->
            <div th:if="${appliedGatheringId != null and appliedGatheringId == post.gatheringId}">
              <button class="btn btn-success btn-sm w-100" disabled>✅ 신청 완료</button>
            </div>

            <!-- 그 외 카드 -->
            <div th:if="${appliedGatheringId == null or appliedGatheringId != post.gatheringId}">
              <form th:action="@{/entry/apply}" method="post">
                <input type="hidden" name="gatheringId" th:value="${post.gatheringId}" />
                <button type="submit" class="btn btn-outline-success btn-sm w-100">
                  ✋ 이 모임에 신청하기
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- 댓글 섹션 -->
        <div class="card-body border-top">
          <h6 class="mb-3">댓글</h6>

          <!-- 댓글 리스트 -->
          <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="c : ${commentMap[post.id]}">
              <div class="d-flex justify-content-between">
                <div>
                  <strong th:text="${c.user.nickname}">작성자</strong>
                  <span class="ms-2" th:text="${c.content}">댓글 내용</span>
                </div>
                <div th:if="${c.userId} == ${currentUserId}">
                  <button class="btn btn-sm btn-outline-secondary me-1"
                          data-bs-toggle="collapse"
                          th:data-bs-target="'#editComment_' + ${c.id}">수정</button>
                  <form th:action="@{/comments/delete}" method="post" class="d-inline">
                    <input type="hidden" name="commentId" th:value="${c.id}" />
                    <input type="hidden" name="postId"    th:value="${post.id}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                  </form>
                </div>
              </div>

              <!-- 댓글 수정 폼 -->
              <div th:id="'editComment_' + ${c.id}" class="collapse mt-2">
                <form th:action="@{/comments/edit}" method="post" class="input-group">
                  <input type="hidden" name="commentId" th:value="${c.id}" />
                  <input type="hidden" name="postId"    th:value="${post.id}" />
                  <input type="text"   name="content" class="form-control" th:value="${c.content}" />
                  <button class="btn btn-primary" type="submit">확인</button>
                </form>
              </div>
            </li>
          </ul>

          <!-- 댓글 작성 폼 -->
          <form th:action="@{/comments/add}" method="post" class="mt-3">
            <input type="hidden" name="postId" th:value="${post.id}" />
            <div class="input-group">
              <input type="text" name="content" class="form-control" placeholder="댓글을 입력하세요" required />
              <button class="btn btn-outline-primary" type="submit">등록</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- 페이지 네비게이션 -->
  <nav aria-label="Page navigation" class="mt-5">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${page > 0} ? '' : 'disabled'">
        <a class="page-link" th:href="@{/community(page=${page-1},size=${size})}">&laquo; 이전</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link">
          <span th:text="${page + 1}">1</span> /
          <span th:text="${totalPages}">1</span>
        </span>
      </li>
      <li class="page-item" th:classappend="${page + 1 < totalPages} ? '' : 'disabled'">
        <a class="page-link" th:href="@{/community(page=${page+1},size=${size})}">다음 &raquo;</a>
      </li>
    </ul>
  </nav>

</section>
</html>
