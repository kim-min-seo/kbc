<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"> <section layout:fragment="contents" class="container mt-5">

    <div class="d-flex justify-content-center align-items-center mb-4">
      <a class="btn btn-outline-primary me-2"
         th:with="
           prevYear=${month == 1} ? (${year - 1}) : ${year},
           prevMonth=${month == 1} ? 12 : (${month - 1})
         "
         th:href="@{/schedule(year=${prevYear},month=${prevMonth})}">&lt;</a>

      <select id="yearSelect"
              class="form-select d-inline-block me-1"
              style="width:auto;"
              th:value="${year}"
              onchange="location.href='?year='+this.value+'&month='+document.getElementById('monthSelect').value">
        <option disabled>연도</option>
        <option th:each="y : ${#numbers.sequence(2020,2030)}"
                th:value="${y}"
                th:text="${y}"
                th:selected="${y == year}"></option>
      </select> 년

      <select id="monthSelect"
              class="form-select d-inline-block ms-1"
              style="width:auto;"
              th:value="${month}"
              onchange="location.href='?year='+document.getElementById('yearSelect').value+'&month='+this.value">
        <option disabled>월</option>
        <option th:each="m : ${#numbers.sequence(1,12)}"
                th:value="${m}"
                th:text="${m}"
                th:selected="${m == month}"></option>
      </select> 월

      <a class="btn btn-outline-primary ms-2"
         th:with="
           nextYear=${month == 12} ? (${year + 1}) : ${year},
           nextMonth=${month == 12} ? 1 : (${month + 1})
         "
         th:href="@{/schedule(year=${nextYear},month=${nextMonth})}">&gt;</a>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered text-center">
        <thead class="table-light">
          <tr>
            <th class="text-danger">일</th><th>월</th><th>화</th><th>수</th>
            <th>목</th><th>금</th><th class="text-primary">토</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="week : ${weeks}">
            <td th:each="day : ${week}" class="calendar-day">
              <div th:if="${day != null}"
                   th:classappend="
                     ${day.getMonthValue() != month ? 'other-month' : ''} + ' ' +
                     (${day.isEqual(today) ? 'today-highlight' : ''})
                   ">
                <strong class="day-number" th:text="${day.dayOfMonth}">1</strong>

                <ul class="list-unstyled small mb-0 game-list"
                    th:if="${scheduleMap.containsKey(day)}">
                  <li th:each="game : ${scheduleMap.get(day)}"
                      th:text="${game}">팀A vs 팀B</li>
                </ul>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

   

  </section>

  <th:block layout:fragment="script"/>

</html>
