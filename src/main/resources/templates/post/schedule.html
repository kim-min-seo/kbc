<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<section layout:fragment="contents"
         class="container mt-5"
         th:with="
           prevYear=${month == 1} ? ${year - 1} : ${year},
           prevMonth=${month == 1} ? 12 : ${month - 1},
           nextYear=${month == 12} ? ${year + 1} : ${year},
           nextMonth=${month == 12} ? 1 : ${month + 1}
         ">

  <!-- DEBUG: scheduleMap 내용 확인 -->
  <pre th:text="${scheduleMap}">[DEBUG scheduleMap]</pre>

  <!-- ◀ 연·월 네비게이션 ▶ -->
  <div class="d-flex justify-content-center align-items-center mb-3">
    <a class="btn btn-outline-primary me-2"
       th:href="@{/schedule(year=${prevYear},month=${prevMonth})}">&lt;</a>
    <select id="yearSelect"
            class="form-select d-inline-block me-1"
            style="width:auto;"
            th:value="${year}"
            onchange="location.href='?year='+this.value+'&month='+document.getElementById('monthSelect').value">
      <option disabled>연도</option>
      <option th:each="y : ${#numbers.sequence(2020,2030)}"
              th:value="${y}" th:text="${y}"
              th:selected="${y == year}"></option>
    </select> 년

    <select id="monthSelect"
            class="form-select d-inline-block ms-1"
            style="width:auto;"
            th:value="${month}"
            onchange="location.href='?year='+document.getElementById('yearSelect').value+'&month='+this.value">
      <option disabled>월</option>
      <option th:each="m : ${#numbers.sequence(1,12)}"
              th:value="${m}" th:text="${m}"
              th:selected="${m == month}"></option>
    </select> 월

    <a class="btn btn-outline-primary ms-2"
       th:href="@{/schedule(year=${nextYear},month=${nextMonth})}">&gt;</a>
  </div>

  <!-- 달력 + 경기 결과 -->
  <div class="table-responsive">
    <table class="table table-bordered text-center">
      <thead class="table-light">
        <tr>
          <th>일</th><th>월</th><th>화</th><th>수</th>
          <th>목</th><th>금</th><th>토</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="week : ${weeks}">
          <td th:each="day : ${week}">
            <div class="p-1 date-cell" th:if="${day != null}">
              <strong th:text="${day.dayOfMonth}">1</strong>
              <div class="game-list mt-1 d-none"
                   th:each="game : ${scheduleMap[day]}">
                <span th:text="${game}">팀A vs 팀B</span><br/>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</section>

<th:block layout:fragment="script">
  <script>
    document.querySelectorAll('.date-cell').forEach(cell => {
      cell.style.cursor = 'pointer';
      cell.addEventListener('click', () => {
        document.querySelectorAll('.game-list')
                .forEach(el => el.classList.add('d-none'));
        const list = cell.querySelector('.game-list');
        if (list) list.classList.toggle('d-none');
      });
    });
  </script>
</th:block>

</html>
