<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<section layout:fragment="contents" class="contents d-flex justify-content-center">
  <div class="user-box w-100" style="max-width: 400px;">
    <h2 class="text-center mb-4">KBC</h2>

    <form id="loginForm">
      <input type="text" id="idInput" class="form-control mb-3" placeholder="아이디를 입력하세요">
      <input type="password" id="passwordInput" class="form-control mb-3" placeholder="비밀번호를 입력하세요">
      <button type="submit" class="btn btn-dark w-100 mb-3">로그인</button>
    </form>

    <div class="text-center mb-4">
      계정이 없으신가요? <a href="/user/join-view">가입하기</a>
    </div>

    <div class="text-center text-secondary mb-2 fw-semibold">소셜 계정으로 로그인</div>
    <div class="text-center">
      <a href="/oauth2/authorization/google">
        <img src="/static/images/google.png" width="40" alt="구글 로그인" style="cursor:pointer;">
      </a>
    </div>
  </div>
</section>

<script layout:fragment="script">
  $("#loginForm").on("submit", function(e){
    e.preventDefault();

    let id = $("#idInput").val();
    let password = $("#passwordInput").val();

    if(id === ""){
      alert("아이디를 입력하세요");
      return;
    }

    if(password === ""){
      alert("비밀번호를 입력하세요");
      return;
    }

    $.ajax({
      type: "post",
      url: "/user/login",
      data: {
        loginId: id,
        password: password
      },
      success: function(response){
        if(response.result === "success"){
          location.href = "/post/list-view";
        } else {
          alert("아이디와 비밀번호를 확인하세요!");
        }
      },
      error: function(){
        alert("로그인 에러!");
      }
    });
  });
</script>
</html>
